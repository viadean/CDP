<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse every research collection in the CDP Resulmation folder.">
    <title>Resulmation Hub — CDP</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --panel: #fff;
            --text: #1f2940;
            --muted: #5b6478;
            --accent: #5b6cf6;
            --border: rgba(20, 31, 63, .1);
            --shadow: 0 14px 40px rgba(18, 35, 67, .08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(124,77,255,.1), transparent 28%), var(--bg);
            font: 16px/1.6 Inter, "Segoe UI", Tahoma, sans-serif;
        }
        a { color: var(--accent); }
        .shell { max-width: 1280px; margin: 0 auto; }
        header, aside, main {
            background: rgba(255,255,255,.9);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }
        header { padding: 28px 32px; margin-bottom: 20px; }
        h1 { margin: 0 0 8px; line-height: 1.2; }
        header p { margin: 0; color: var(--muted); }
        .layout { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 20px; align-items: start; }
        aside { padding: 18px; position: sticky; top: 20px; }
        aside h2 { margin: 0 0 12px; font-size: 1rem; }
        #fileCount { color: var(--muted); font-weight: 400; }
        #contentList { display: grid; gap: 8px; }
        .file-button {
            width: 100%; padding: 11px 12px; border: 1px solid transparent; border-radius: 10px;
            background: #f7f8ff; color: var(--text); text-align: left; font: inherit; cursor: pointer;
            overflow-wrap: anywhere;
        }
        .file-button:hover, .file-button.active { background: #eef0ff; border-color: rgba(91,108,246,.25); }
        main { min-height: 420px; padding: 28px; }
        #status { color: var(--muted); }
        .markdown-content { overflow-wrap: anywhere; }
        .markdown-content img { max-width: 100%; height: auto; border-radius: 12px; }
        .markdown-content pre { overflow-x: auto; padding: 14px; background: #f5f7ff; border-radius: 10px; }
        .markdown-content table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
        .markdown-content th, .markdown-content td { padding: 8px; border: 1px solid var(--border); }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        .actions a { padding: 9px 13px; border-radius: 9px; background: #f1f2ff; text-decoration: none; font-weight: 600; }
        @media (max-width: 760px) {
            body { padding: 14px; }
            header, main { padding: 20px; }
            .layout { grid-template-columns: 1fr; }
            aside { position: static; }
            #contentList { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <h1>Resulmation Hub</h1>
            <p>Browse all Markdown collections in the <a href="https://github.com/viadean/CDP/tree/main/Resulmation">Resulmation folder</a>.</p>
        </header>
        <div class="layout">
            <aside aria-label="Resulmation collections">
                <h2>Collections <span id="fileCount"></span></h2>
                <nav id="contentList" aria-label="Collection files"></nav>
            </aside>
            <main id="contentDisplay" aria-live="polite">
                <p id="status">Loading all Resulmation files…</p>
            </main>
        </div>
    </div>
    <script>
        const apiUrl = 'https://api.github.com/repos/viadean/CDP/contents/Resulmation?ref=main';
        const rawBase = 'https://raw.githubusercontent.com/viadean/CDP/main/Resulmation/';
        const githubBase = 'https://github.com/viadean/CDP/blob/main/Resulmation/';
        const list = document.getElementById('contentList');
        const display = document.getElementById('contentDisplay');

        async function loadCollection(file, button) {
            document.querySelectorAll('.file-button').forEach(item => item.classList.toggle('active', item === button));
            display.innerHTML = '<p id="status">Loading collection…</p>';
            try {
                const response = await fetch(rawBase + encodeURIComponent(file.name));
                if (!response.ok) throw new Error(`Request failed: ${response.status}`);
                const markdown = await response.text();
                const rendered = DOMPurify.sanitize(marked.parse(markdown));
                const sourceUrl = githubBase + encodeURIComponent(file.name);
                display.innerHTML = `<article class="markdown-content">${rendered}</article><div class="actions"><a href="${sourceUrl}" target="_blank" rel="noopener noreferrer">View source on GitHub</a></div>`;
                display.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (error) {
                console.error('Unable to load collection:', error);
                display.innerHTML = '<p role="alert">Unable to load this collection. Please try again or open it directly on GitHub.</p>';
            }
        }

        async function init() {
            try {
                const response = await fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' } });
                if (!response.ok) throw new Error(`GitHub API request failed: ${response.status}`);
                const entries = await response.json();
                const files = entries
                    .filter(entry => entry.type === 'file' && entry.name.toLowerCase().endsWith('.md'))
                    .sort((a, b) => a.name.localeCompare(b.name));
                document.getElementById('fileCount').textContent = `(${files.length})`;
                if (files.length === 0) {
                    display.innerHTML = '<p>No Markdown files were found in Resulmation.</p>';
                    return;
                }
                files.forEach((file, index) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'file-button';
                    button.textContent = file.name.replace(/\.md$/i, '');
                    button.setAttribute('aria-label', `Open ${file.name}`);
                    button.addEventListener('click', () => loadCollection(file, button));
                    list.appendChild(button);
                    if (index === 0) loadCollection(file, button);
                });
            } catch (error) {
                console.error('Unable to list Resulmation files:', error);
                display.innerHTML = '<p role="alert">Unable to load the Resulmation file list. You can <a href="https://github.com/viadean/CDP/tree/main/Resulmation">browse the folder on GitHub</a> instead.</p>';
            }
        }

        init();
    </script>
</body>
</html>

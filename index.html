<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP - E-Product Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .header {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 60px 40px;
            max-width: 800px;
            margin: 0 auto 40px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        p {
            color: #666;
            font-size: 1em;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .links {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        a {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        a:hover {
            background: #764ba2;
        }
        
        .secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .secondary:hover {
            background: #e0e0e0;
        }
        
        .diagrams-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto 40px;
        }
        
        .diagrams-section h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.8em;
        }
        
        .diagrams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .diagram-card {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .diagram-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-5px);
        }
        
        .diagram-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .diagram-card a {
            display: inline-block;
            padding: 8px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .diagram-card a:hover {
            background: #764ba2;
        }
        
        .diagram-preview {
            margin-top: 20px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .diagram-preview h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .mermaid {
            display: flex;
            justify-content: center;
        }
        
        .close-btn {
            background: #f0f0f0 !important;
            color: #333 !important;
            padding: 8px 16px !important;
            margin-top: 15px;
        }
        
        .close-btn:hover {
            background: #e0e0e0 !important;
        }

        @media (max-width: 600px) {
            .diagrams-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 CDP</h1>
        <p class="subtitle">E-Product Hub</p>
        
        <p>Welcome to the CDP E-Product Hub repository. This is your central hub for managing and accessing digital products.</p>
        
        <div class="links">
            <a href="https://github.com/viadean/CDP">View on GitHub</a>
            <a href="https://payhip.com/CDP" class="secondary">Visit Website</a>
        </div>
    </div>

    <div class="diagrams-section">
        <h2>📊 Diagrams</h2>
        <div class="diagrams-grid" id="diagramGrid"></div>
        <div id="previewContainer"></div>
    </div>

    <script>
        // List of diagrams in the Diagrams folder
        const diagrams = [
            { name: 'ASCII Diagram', file: 'ASCIIDiagram.md' },
            { name: 'Block Diagram', file: 'BlockDiagram.md' },
            { name: 'ERD', file: 'ERD.md' },
            { name: 'Flowchart', file: 'Flowchart.md' },
            { name: 'Kanban', file: 'Kanban.md' },
            { name: 'Quadrant Chart', file: 'QuadrantChart.md' },
            { name: 'Sequence Diagram', file: 'SequenceDiagram.md' },
            { name: 'State Diagram', file: 'StateDiagram.md' }
        ];

        const gridContainer = document.getElementById('diagramGrid');
        const previewContainer = document.getElementById('previewContainer');

        // Create diagram cards
        diagrams.forEach((diagram, index) => {
            const card = document.createElement('div');
            card.className = 'diagram-card';
            card.innerHTML = `
                <h3>${diagram.name}</h3>
                <a href="https://github.com/viadean/CDP/blob/main/Diagrams/${diagram.file}">View on GitHub</a>
                <button class="diagram-card" style="background: none; border: none; padding: 0; margin-top: 10px;">
                    <a style="display: inline-block; padding: 8px 20px; background: #764ba2; color: white; text-decoration: none; border-radius: 5px; font-size: 0.9em; cursor: pointer;" onclick="loadPreview('${diagram.file}')">Preview</a>
                </button>
            `;
            gridContainer.appendChild(card);
        });

        // Function to load and display diagram preview
        async function loadPreview(filename) {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/viadean/CDP/main/Diagrams/${filename}`);
                const content = await response.text();
                
                // Extract mermaid content from markdown
                const mermaidMatch = content.match(/```mermaid([\s\S]*?)```/);
                const mermaidContent = mermaidMatch ? mermaidMatch[1].trim() : content;
                
                previewContainer.innerHTML = `
                    <div class="diagram-preview">
                        <h3>${filename}</h3>
                        <div class="mermaid">${mermaidContent}</div>
                        <button class="close-btn" onclick="closePreview()">Close Preview</button>
                    </div>
                `;
                
                // Reinitialize mermaid to render the new diagram
                mermaid.contentLoaded();
                
                // Scroll to preview
                previewContainer.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                previewContainer.innerHTML = `
                    <div class="diagram-preview">
                        <h3>Error Loading Preview</h3>
                        <p>Could not load ${filename}. Please <a href="https://github.com/viadean/CDP/blob/main/Diagrams/${filename}">view it on GitHub</a>.</p>
                        <button class="close-btn" onclick="closePreview()">Close</button>
                    </div>
                `;
            }
        }

        // Function to close preview
        function closePreview() {
            previewContainer.innerHTML = '';
        }

        // Initialize mermaid
        mermaid.initialize({ startOnLoad: true, theme: 'default' });
    </script>
</body>
</html>
